<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Expense &amp; Budget Visualizer</h1>
    <section id="balance-display" class="balance-display" aria-live="polite">
      <span class="balance-label">Total Balance</span>
      <span class="balance-value">$0.00</span>
    </section>
  </header>

  <main class="app-main">
    <section class="form-section">
      <form id="transaction-form" novalidate>
        <div class="form-field">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" name="item-name" maxlength="100" autocomplete="off">
        </div>

        <div class="form-field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" min="0.01" max="999999999.99" step="0.01" autocomplete="off">
        </div>

        <div class="form-field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit" id="add-button">Add Transaction</button>
      </form>

      <div id="validation-messages" class="validation-messages" aria-live="polite"></div>
      <div id="save-error" class="save-error" aria-live="assertive"></div>
    </section>

    <section class="list-section">
      <h2>Transactions</h2>
      <div id="transaction-list" class="transaction-list">
        <p id="empty-state" class="empty-state">No transactions yet. Add one above to get started.</p>
      </div>
    </section>

    <section class="chart-section">
      <h2>Spending by Category</h2>
      <div class="chart-wrapper">
        <canvas id="pie-chart" class="pie-chart" width="220" height="220"></canvas>
        <div id="chart-legend" class="chart-legend"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
